        note: "Upstream's testGetClassLongName and testGetClassLongIllegalName from the fix commit, ported to JUnit 3.8.1 in src/test/org/apache/commons/lang/ClassUtilsOssFuzzTest.java with both inputs unchanged, run against Central's commons-lang 2.4 (baseline) and 2.6 (control) jars, each method in a fresh JVM at -Xss256k, ten times. 2.4 throws ClassNotFoundException in all 20 runs; 2.6 throws StackOverflowError in all 20. At the JVM's default stack 2.6 passes too, so the stack is part of the command."
